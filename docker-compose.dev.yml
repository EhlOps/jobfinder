# Development override: plain HTTP on localhost, no domain or certificates. Mail still goes out through the
# `smtp` relay, so dev sends real emails (use `cli reset-link` to get a link without sending).
# Enabled by COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml in the root .env (see .env.example),
# so a plain `docker compose up --build` works. Production uses docker-compose.prod.yml instead.
services:
  web:
    environment:
      SITE_ADDRESS: ":80"   # plain HTTP, whatever SITE_ADDRESS says in .env

  api:
    environment:
      PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-8180}   # http, so the session cookie is not Secure

  worker:
    environment:
      PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-8180}
