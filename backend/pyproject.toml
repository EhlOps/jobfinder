[project]
name = "jobfinder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.12",
  "apscheduler>=3.10,<4",
  "aiosmtplib>=3.0",
  "pdfplumber>=0.11.10",
  "python-docx>=1.2.0",
  "trafilatura>=2.3.0",
  "pydantic[email]>=2.13.5",
  "jinja2>=3.1.6",
  "itsdangerous>=2.2.0",
  "reportlab>=5.0.1",
  "lxml>=5.0",  # HTML scraping (SuccessFactors RMK); already pulled in by trafilatura
]

[project.optional-dependencies]
# LinkedIn/Indeed scraping (opt-in, heavy: pulls in pandas/numpy)
jobspy = ["python-jobspy>=1.1.80"]
# The opt-in render worker (backend/Dockerfile.renderer). Pinned to the Playwright image's version.
renderer = ["playwright==1.63.0"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobfinder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberate broad catches: a bad upload/URL/task must not take down a request or the worker.
ignore = ["BLE001"]

# Report-only architecture contracts: CI runs lint-imports with continue-on-error until #53 makes
# them blocking. They describe the package as it is today; #53 replaces them with the layer rules.
[tool.importlinter]
root_package = "jobfinder"

[[tool.importlinter.contracts]]
name = "Only the app factory (main) imports the HTTP routers"
type = "forbidden"
source_modules = [
  "jobfinder.ai",
  "jobfinder.auth",
  "jobfinder.cli",
  "jobfinder.config",
  "jobfinder.db",
  "jobfinder.ingest",
  "jobfinder.letters",
  "jobfinder.matching",
  "jobfinder.models",
  "jobfinder.notify",
  "jobfinder.profile",
  "jobfinder.questions",
  "jobfinder.renderer",
  "jobfinder.resumes",
  "jobfinder.scheduling",
  "jobfinder.storage",
  "jobfinder.worker",
]
forbidden_modules = ["jobfinder.api"]

[[tool.importlinter.contracts]]
name = "The api package does not import the Claude CLI client directly"
type = "forbidden"
source_modules = ["jobfinder.api"]
forbidden_modules = ["jobfinder.ai.claude_code"]
allow_indirect_imports = true
