[project]
name = "jobfinder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.12",
  "apscheduler>=3.10,<4",
  "pyyaml>=6.0",
  "aiosmtplib>=3.0",
  "pdfplumber>=0.11.10",
  "python-docx>=1.2.0",
  "trafilatura>=2.3.0",
  "pydantic[email]>=2.13.5",
  "jinja2>=3.1.6",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
# LinkedIn/Indeed scraping (opt-in, heavy: pulls in pandas/numpy)
jobspy = ["python-jobspy>=1.1.80"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobfinder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberate broad catches: a bad upload/URL/task must not take down a request or the worker.
ignore = ["BLE001"]
