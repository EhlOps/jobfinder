[project]
name = "jobfinder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.12",
  "apscheduler>=3.10,<4",
  "aiosmtplib>=3.0",
  "pdfplumber>=0.11.10",
  "python-docx>=1.2.0",
  "trafilatura>=2.3.0",
  "pydantic[email]>=2.13.5",
  "jinja2>=3.1.6",
  "itsdangerous>=2.2.0",
  "reportlab>=5.0.1",
  "lxml>=5.0",  # HTML scraping (SuccessFactors RMK); already pulled in by trafilatura
  "taskiq>=0.13",
  "taskiq-redis>=1.2",
  "typer>=0.27",
]

[project.scripts]
# The Typer app; `python -m jobfinder.cli` also maps the pre-#49 command names (jobfinder.cli._legacy).
jobfinder = "jobfinder.cli:app"

[project.optional-dependencies]
# LinkedIn/Indeed scraping (opt-in, heavy: pulls in pandas/numpy)
jobspy = ["python-jobspy>=1.1.80"]
# The opt-in render worker (backend/Dockerfile.renderer). Pinned to the Playwright image's version.
renderer = ["playwright==1.63.0"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobfinder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_commit: runs sessions concurrently or needs commits visible on other connections; gets a real engine on its own database, truncated per test, instead of a rolled-back transaction",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberate broad catches: a bad upload/URL/task must not take down a request or the worker.
ignore = ["BLE001"]

[tool.ruff.lint.isort]
# The ingest/sources, recipes and discovery shims (#42) have no module files left for ruff to find.
known-first-party = ["jobfinder"]

# Architecture contracts, blocking in CI since #53 (tests/test_architecture.py checks what these can't:
# commits, core's size, no BaseModel in api/). Each failure names the rule a change broke.
[tool.importlinter]
root_package = "jobfinder"
include_external_packages = true  # so "api and services never import sqlalchemy" can be stated

[[tool.importlinter.contracts]]
name = "Layers (#53): entrypoints > api > services | context > schemas > repositories | integrations > task ledger > models > core"
type = "layers"
# Top to bottom; a module may import only from layers below its own. "|" siblings are independent of
# each other, ":" siblings may import each other.
#   entrypoints  the CLI, the scheduler, the task workers and their runtime, the renderer container
#   context      the app context: core's infrastructure plus Claude and the document store
#   task ledger  where services queue work (ledger.add) and the brokers that deliver it
layers = [
  "jobfinder.cli : jobfinder.scheduler : jobfinder.renderer : jobfinder.tasks.__main__ : jobfinder.tasks.ai : jobfinder.tasks.io : jobfinder.tasks.documents : jobfinder.tasks.render : jobfinder.tasks.runtime",
  "jobfinder.api",
  "jobfinder.services | jobfinder.context",
  "jobfinder.schemas",
  "jobfinder.repositories | jobfinder.integrations | jobfinder.storage | jobfinder.profile | jobfinder.resumes",
  "jobfinder.tasks.ledger : jobfinder.tasks.kinds : jobfinder.tasks.brokers",
  "jobfinder.models",
  "jobfinder.core",
]
ignore_imports = [
  # Old paths other #53 units delete or rework; the coordinator strips these once they are merged.
  "jobfinder.integrations.directories -> jobfinder.ingest.validate",  # removed by #53 merge
  "jobfinder.profile.interview -> jobfinder.ingest._moved",  # removed by #53 merge
  "jobfinder.profile.github -> jobfinder.integrations.github",  # removed by #53 merge
  "jobfinder.resumes.service -> jobfinder.ingest._moved",  # removed by #53 merge
]

# Queries live in repositories. Typing and catching a unique-key race need no sqlalchemy import:
# core.db re-exports AsyncSession and IntegrityError.
[[tool.importlinter.contracts]]
name = "No SQL in api or services: they never import sqlalchemy (#53)"
type = "forbidden"
source_modules = ["jobfinder.api", "jobfinder.services"]
forbidden_modules = ["sqlalchemy"]
allow_indirect_imports = true  # services -> repositories -> sqlalchemy is the layering

[[tool.importlinter.contracts]]
name = "Routers call services, not repositories (#44-#46)"
type = "forbidden"
source_modules = ["jobfinder.api"]
forbidden_modules = ["jobfinder.repositories"]
allow_indirect_imports = true  # api -> services -> repositories is the layering

[[tool.importlinter.contracts]]
name = "The api does not import the Claude CLI client directly"
type = "forbidden"
source_modules = ["jobfinder.api"]
forbidden_modules = ["jobfinder.integrations.claude.claude_code"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The API schemas import no integrations (the Claude task schemas are not the API contract)"
type = "forbidden"
source_modules = ["jobfinder.schemas"]
forbidden_modules = ["jobfinder.integrations"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only uvicorn loads the HTTP app: no other entrypoint imports the api"
type = "forbidden"
source_modules = ["jobfinder.cli", "jobfinder.renderer", "jobfinder.scheduler", "jobfinder.tasks"]
forbidden_modules = ["jobfinder.api"]

[[tool.importlinter.contracts]]
name = "The entrypoints are independent: the CLI, the scheduler and the renderer share code only through lower layers"
type = "independence"
modules = ["jobfinder.cli", "jobfinder.scheduler", "jobfinder.renderer"]
