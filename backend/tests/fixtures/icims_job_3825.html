<script type="application/ld+json">{"validThrough":"2027-06-23T04:00:00.000Z","employmentType":"FULL_TIME","@type":"JobPosting","baseSalary":{"minValue":65000,"maxValue":100000,"@type":"MonetaryAmount","currency":"USD"},"salaryCurrency":"USD","description":"<h2>What we are looking for<\/h2>\n<p>We are looking for a Project Engineer to support the Solid Waste industry in our Des Moines, Iowa office. Project Engineers work with both clients and projects and help develop junior staff. As a Project Engineer, you will manage projects and work on a team to provide engineering support to our existing solid waste practice focused on landfill and landfill gas system permitting and design, solid waste facility permitting and design, construction, operation, monitoring, and air quality permitting and compliance support for private and municipal clients. This includes opportunities for solid waste facility and environmental control system infrastructure permitting and design, engineering analysis, feasibility studies, report writing, construction oversight, field sampling and testing, and permitting. You may also support potential select strategic practice areas, such as wastewater treatment, organics management, alternative energy (solar and biogas), greenhouse gas (GHG) and sustainability, climate change and adaptation, PFAS and emerging contaminants, and carbon sequestration. You will be located in our West Des Moines, Iowa office. <\/p>\n<h2>How you can make an impact<\/h2>\n<p>You will help our clients address their environmental challenges, which may include:<\/p>\n<ul>\n <li>Permitting, design, and construction<\/li>\n <ul>\n  <li>Municipal solid waste landfills<\/li>\n  <li>Landfill gas and biogas<\/li>\n  <li>Transfer Stations<\/li>\n <\/ul>\n <li>Sustainable materials management<\/li>\n <ul>\n  <li>Recycling<\/li>\n  <li>Waste minimization studies<\/li>\n  <li>Organics management<\/li>\n  <li>Composting<\/li>\n <\/ul>\n <li>&nbsp;Apply intensive and diversified knowledge of engineering and scientific principles and practices in solid waste assignment areas and related fields.<\/li>\n <li>Prepare engineering calculations, drawings, reports, and permit applications.<\/li>\n <li>Makes decisions independently on engineering or scientific problems and methods, plan and coordinate work, and represent us at meetings and conferences.<\/li>\n <li>Field work in varied terrain and weather will be required, including but not limited to, surveys/data gathering, construction quality assurance, inspections, etc.<\/li>\n <li>Office based tasks including: CAD drafting, mathematical calculations, report writing, creating site plans and facility diagrams, permit applications, etc.<\/li>\n <li>Business development including: proposal preparation, meeting with clients, and attending industry related conferences/trade shows.<\/li>\n <li>Receive technical guidance on unusual or complex problems and supervisory approval on proposed plans or projects.<\/li>\n<\/ul>\n<h2>Qualifications<\/h2>\n<ul>\n <li>Bachelor\u2019s or Masters of Science Degree in an Environmental, Civil, Construction or related engineering field required<\/li>\n <li>4+ years of related work experience required, with 3+ years in consulting or industry required<\/li>\n <li>E.I.T. required. P.E. is a plus.<\/li>\n <li>Experience with using AutoCAD Civil 3D design software preferred.<\/li>\n <li>Valid driver\u2019s license and driving record in good standing required<\/li>\n<\/ul>\n<h2>Pay Range<\/h2>USD $65,000.00 - USD $100,000.00 /Yr.\n<h2>Additional Information<\/h2>Please note that our pay ranges are determined by several factors, including relevant experience, internal pay equity, and location. They do not include any of the amazing benefits of being an employee-owner, which are listed below. SCS is building a world where environmental systems and infrastructure strengthen the health, safety and resilience of communities \u2014 from reducing methane emissions at landfills to producing alternative energy, from repurposing contaminated properties to sequestering carbon. As a 100% employee-owned firm, we bring a long-term perspective, personal ownership and shared success to everything we do. We live our values every day: We care. We are a team. We are tenacious. Join us and be part of a team where your work has real impact \u2014 on the world and on your own growth. As a growing firm, we offer excellent opportunities for career advancement and a comprehensive package, including: Medical, Dental, Vision, Life and Disability Insurance 100% employer- funded Employee Stock Ownership Plan (ESOP) and 401K including employer match Annual Bonus Program Student Debt Employer Contribution Program Paid holidays, PTO and Paid Parental Leave SCS Engineers is an Equal Opportunity Employer (EOE). SCS provides equal employment opportunities to all qualified applicants without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, protected veteran or disabled status. If you have questions, difficulty using our online system and/or you need an accommodation due to a disability then please contact us about your interest in employment at recruiting@scsengineers.com #LI-Hybrid #LI-BC1","directApply":true,"title":"Project Engineer","@context":"http://schema.org","url":"https://careers-scsengineers.icims.com/jobs/3825/project-engineer/job","hiringOrganization":{"@type":"Organization","name":"SCS Engineers","sameAs":"www.scsengineers.com"},"jobLocation":[{"address":{"addressCountry":"US","streetAddress":"1690 All-State Court","@type":"PostalAddress","postalCode":"50265","addressLocality":"West Des Moines","addressRegion":"IA","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"datePosted":"2026-06-23T04:00:00.000Z","occupationalCategory":"Experienced Engineer - Professional and/or Project Management"}</script>
