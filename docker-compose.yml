services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Published on localhost only so host-side pytest/alembic can reach it.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Parts, not a URL: the app percent-encodes the password (a URL built here would break on @ / %).
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      STORE_DIR: /data/store
      CLAUDE_AUTH_DIR: /data/claude
      FORWARDED_ALLOW_IPS: "*"  # trust Caddy's X-Forwarded-For (only the web container and localhost can reach the api)
      # The task platform (#48): root .env TASKS_BACKEND=ledger (with COMPOSE_PROFILES=ledger) makes the api
      # publish to valkey after commit. Set here, not in backend/.env, so one switch covers every service.
      TASKS_BACKEND: ${TASKS_BACKEND:-legacy}
    volumes:
      - store:/data/store
      - claude-auth:/data/claude
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"

  # The legacy worker (TASKS_BACKEND=legacy, the default): runs scheduled ingestion/matching/digests and
  # consumes the Postgres task queue. Refuses to start under ledger, where scheduler, worker-ai and
  # worker-io (profile "ledger", below) replace it: then LEGACY_WORKER_REPLICAS=0 in the root .env.
  # Only the worker image carries the `claude` CLI; the api never calls the LLM.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        WITH_JOBSPY: ${WITH_JOBSPY:-false}
    restart: unless-stopped
    # 0 under the ledger (root .env), so a later plain `docker compose up` doesn't bring it back.
    deploy:
      replicas: ${LEGACY_WORKER_REPLICAS:-1}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Parts, not a URL: the app percent-encodes the password (a URL built here would break on @ / %).
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      STORE_DIR: /data/store
      CLAUDE_AUTH_DIR: /data/claude
      TASKS_BACKEND: ${TASKS_BACKEND:-legacy}
    volumes:
      - store:/data/store
      - claude-auth:/data/claude
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy

  # ── Task platform (#48), profile "ledger" ───────────────────────────────────────────────────────────
  # Not started by a plain `docker compose up`. To switch, in the root .env: COMPOSE_PROFILES=ledger,
  # TASKS_BACKEND=ledger and LEGACY_WORKER_REPLICAS=0, then `docker compose up -d --build`. Back to
  # legacy: `docker compose --profile ledger stop scheduler worker-ai worker-io`, remove the three lines,
  # then `docker compose up -d`. docs/k3s.md, "Task platform", explains the system.
  # These start once the api is up; on the first start after a pull with a migration they may restart
  # until the api has migrated (the legacy worker does the same).

  # Delivery only: each message is a ledger id. AOF on, so queued messages survive a restart; noeviction,
  # so a full valkey fails writes (the relay re-sends later) instead of dropping keys.
  valkey:
    image: valkey/valkey:8.1.10
    profiles: ["ledger"]
    restart: unless-stopped
    command: ["valkey-server", "--dir", "/data", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Localhost only, for valkey-cli or a worker run on the host (VALKEY_URL=redis://127.0.0.1:6380/0).
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6380}:6379"

  # Cron, the relay (re-sends due rows a lost publish left queued) and the reaper. Exactly one. The api
  # image: no claude needed. It writes /tmp/scheduler-alive on every relay tick.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["ledger"]
    restart: unless-stopped
    command: ["python", "-m", "jobfinder.scheduler"]
    init: true              # the api image has no tini
    stop_grace_period: 20s  # on SIGTERM it finishes its tick for up to 10s
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TASKS_BACKEND: ${TASKS_BACKEND:-legacy}   # it refuses to start unless ledger
      MIGRATE_ON_START: "false"                 # the api migrates
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/scheduler-alive -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      start_period: 60s
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Stream jobfinder:ai: every kind that may call Claude, AI_MAX_CONCURRENCY at once. Needs the claude
  # CLI (worker image), the store and the saved Claude token.
  worker-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        WITH_JOBSPY: ${WITH_JOBSPY:-false}
    profiles: ["ledger"]
    restart: unless-stopped
    command: ["python", "-m", "jobfinder.tasks", "ai"]
    stop_grace_period: 60s   # lets an in-flight task finish and ack
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      STORE_DIR: /data/store
      CLAUDE_AUTH_DIR: /data/claude
      TASKS_BACKEND: ${TASKS_BACKEND:-legacy}
    volumes:
      - store:/data/store
      - claude-auth:/data/claude
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Stream jobfinder:io: ingestion, planning, discovery, coverage scoring, and reading uploads and profile
  # links (parse_document, fetch_link: #51, so the store); WORKER_IO_CONCURRENCY at once. No Claude; the
  # worker image for ingestion's dependencies.
  worker-io:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        WITH_JOBSPY: ${WITH_JOBSPY:-false}
    profiles: ["ledger"]
    restart: unless-stopped
    command: ["python", "-m", "jobfinder.tasks", "io"]
    stop_grace_period: 60s
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      STORE_DIR: /data/store
      TASKS_BACKEND: ${TASKS_BACKEND:-legacy}
    volumes:
      - store:/data/store
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Opt-in headless browser (resolver rung 4.5): runs only render_* tasks (under ledger: stream
  # jobfinder:render). Not started by a plain `docker compose up`; enable with COMPOSE_PROFILES=renderer
  # (root .env; "renderer,ledger" with the task platform) + RENDERER_ENABLED=true (backend/.env). Gets
  # only the database and task settings: no backend/.env, no volumes, no published ports.
  renderer:
    build:
      context: ./backend
      dockerfile: Dockerfile.renderer
    profiles: ["renderer"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TASKS_BACKEND: ${TASKS_BACKEND:-legacy}   # VALKEY_URL keeps its default, redis://valkey:6379/0
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m
    mem_limit: 1536m
    pids_limit: 512
    cpus: 1.5
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  # Caddy: serves the built app, proxies /api to the api, sets security headers, and gets TLS
  # certificates when SITE_ADDRESS is a domain (see frontend/Caddyfile, docker-compose.prod.yml and the
  # README's Deploy section).
  web:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - caddy-data:/data      # certificates: keep, or Let's Encrypt rate limits bite on rebuilds
      - caddy-config:/config
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8180}:80"

  # Outbound mail. Internal only (no published port): the app sends to smtp:587.
  # Relay mode (default): set RELAYHOST + credentials in .env to send via Gmail/Outlook.
  # Direct mode: leave RELAYHOST empty, set up SPF/DKIM/DMARC and a host with outbound :25.
  smtp:
    image: boky/postfix
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${ALLOWED_SENDER_DOMAINS:-localhost}
      RELAYHOST: ${RELAYHOST:-}
      RELAYHOST_USERNAME: ${RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${RELAYHOST_PASSWORD:-}
    volumes:
      - dkim:/etc/opendkim/keys

volumes:
  pgdata:
  valkey-data:
  store:
  claude-auth:
  dkim:
  caddy-data:
  caddy-config:
