services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Published on localhost only so host-side pytest/alembic can reach it.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Parts, not a URL: the app percent-encodes the password (a URL built here would break on @ / %).
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      STORE_DIR: /data/store
      CLAUDE_AUTH_DIR: /data/claude
      FORWARDED_ALLOW_IPS: "*"  # trust Caddy's X-Forwarded-For (only the web container and localhost can reach the api)
    volumes:
      - store:/data/store
      - claude-auth:/data/claude
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"

  # Runs scheduled ingestion/matching/digests and consumes the Postgres task queue.
  # Only this image carries the `claude` CLI; the api never calls the LLM.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        WITH_JOBSPY: ${WITH_JOBSPY:-false}
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Parts, not a URL: the app percent-encodes the password (a URL built here would break on @ / %).
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      STORE_DIR: /data/store
      CLAUDE_AUTH_DIR: /data/claude
    volumes:
      - store:/data/store
      - claude-auth:/data/claude
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy

  # Opt-in headless browser (resolver rung 4.5): claims only render_* tasks. Not started by a plain
  # `docker compose up`; enable with COMPOSE_PROFILES=renderer (root .env) + RENDERER_ENABLED=true
  # (backend/.env). Gets only the database settings: no backend/.env, no volumes, no published ports.
  renderer:
    build:
      context: ./backend
      dockerfile: Dockerfile.renderer
    profiles: ["renderer"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m
    mem_limit: 1536m
    pids_limit: 512
    cpus: 1.5
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  # Caddy: serves the built app, proxies /api to the api, sets security headers, and gets TLS
  # certificates when SITE_ADDRESS is a domain (see frontend/Caddyfile, docker-compose.prod.yml and the
  # README's Deploy section).
  web:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - caddy-data:/data      # certificates: keep, or Let's Encrypt rate limits bite on rebuilds
      - caddy-config:/config
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8180}:80"

  # Outbound mail. Internal only (no published port): the app sends to smtp:587.
  # Relay mode (default): set RELAYHOST + credentials in .env to send via Gmail/Outlook.
  # Direct mode: leave RELAYHOST empty, set up SPF/DKIM/DMARC and a host with outbound :25.
  smtp:
    image: boky/postfix
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${ALLOWED_SENDER_DOMAINS:-localhost}
      RELAYHOST: ${RELAYHOST:-}
      RELAYHOST_USERNAME: ${RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${RELAYHOST_PASSWORD:-}
    volumes:
      - dkim:/etc/opendkim/keys

volumes:
  pgdata:
  store:
  claude-auth:
  dkim:
  caddy-data:
  caddy-config:
