# One policy for the whole site. add_header is not inherited into a location that sets its own, so
# everything lives here, at server level, and only the Referrer-Policy value varies by path.
# ($request_uri, not $uri: try_files rewrites $uri to /index.html for SPA routes.)
map $request_uri $referrer_policy {
    default                      "strict-origin-when-cross-origin";
    ~^/reset-password(\?|$)      "no-referrer";  # the reset token is in the URL fragment; keep it out of any Referer
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Same origin -> session cookie works with no CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, so clients cannot spoof their IP
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
