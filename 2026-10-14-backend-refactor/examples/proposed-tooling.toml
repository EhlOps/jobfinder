# Sketch (v2): additions to backend/pyproject.toml (D6, D7, D8).

[project.scripts]
jobfinder = "jobfinder.cli:app"          # uv run jobfinder --help

[project]
dependencies = [
  # ... existing ...
  "typer>=0.12",
  "taskiq>=0.11",
  "taskiq-redis>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7",
  "pytest-xdist>=3.6",                     # uv run pytest -n auto (one test DB per worker: jobfinder_test_gw0, ...)
  "respx>=0.21",                           # fake httpx for sources and the resolver
  "import-linter>=2.1",                    # uv run lint-imports
]

[tool.importlinter]
root_package = "jobfinder"
include_external_packages = true          # needed for the sqlalchemy.sql contract below

[[tool.importlinter.contracts]]
name = "Layers by kind"
type = "layers"
layers = [
  "jobfinder.api.app : jobfinder.tasks : jobfinder.scheduler : jobfinder.cli : jobfinder.renderer",  # ":" = may import each other
  "jobfinder.api.routers",
  "jobfinder.services",
  "jobfinder.repositories | jobfinder.integrations",   # "|" = independent of each other
  "jobfinder.models",
  "jobfinder.core",
]

[[tool.importlinter.contracts]]
name = "SQL only in repositories"
type = "forbidden"
source_modules = ["jobfinder.api", "jobfinder.services"]
forbidden_modules = ["sqlalchemy.sql", "sqlalchemy.dialects"]   # sqlalchemy.ext.asyncio (the session type) stays allowed

