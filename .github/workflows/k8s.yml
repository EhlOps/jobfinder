# Renders every Kustomize entry point under deploy/k8s and validates the output against the
# Kubernetes schemas (kubeconform), so a broken manifest is caught before anyone applies it.
# Custom resources (SealedSecret, HelmChart, KEDA's ScaledObject) are checked against the community
# CRDs-catalog; a kind that neither knows is skipped (-ignore-missing-schemas).
name: k8s

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "deploy/k8s/**"
      - "deploy/k3s/manifests/**"
      # The app's ConfigMap is generated from these (#43).
      - "backend/kustomization.yaml"
      - "backend/.env.defaults"
      - ".github/workflows/k8s.yml"
  push:
    branches: [main, dev]
    paths:
      - "deploy/k8s/**"
      - "deploy/k3s/manifests/**"
      # The app's ConfigMap is generated from these (#43).
      - "backend/kustomization.yaml"
      - "backend/.env.defaults"
      - ".github/workflows/k8s.yml"

concurrency:
  group: k8s-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Render
        run: |
          mkdir -p rendered
          for k in deploy/k8s/overlays/staging deploy/k8s/overlays/prod deploy/k8s/hello; do
            out="rendered/$(echo "$k" | tr / _).yaml"
            echo "kustomize $k -> $out"
            kubectl kustomize "$k" > "$out"
          done
          # Cluster add-on manifests that k3s applies itself (HelmChart: validated through the catalog).
          cp deploy/k3s/manifests/*.yaml rendered/

      - name: Validate
        run: |
          docker run --rm -v "$PWD/rendered:/r" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -ignore-missing-schemas -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary -output text /r

      # #52. worker-ai is never autoscaled: one process is the cap on parallel Claude calls against the
      # subscription. worker-io's replicas belong to KEDA's HPA, so its Deployment must not set any
      # (every deploy would reset the count). yq is preinstalled on the runner.
      - name: Scaling policy
        run: |
          for f in rendered/deploy_k8s_overlays_*.yaml; do
            n=$(yq ea '[select(.kind == "ScaledObject" or .kind == "HorizontalPodAutoscaler") | select(.spec.scaleTargetRef.name == "worker-ai")] | length' "$f")
            [ "$n" = 0 ] || { echo "::error file=$f::worker-ai must never be autoscaled (#52)"; exit 1; }
            r=$(yq ea 'select(.kind == "Deployment" and .metadata.name == "worker-ai") | .spec.replicas' "$f")
            [ "$r" -le 1 ] || { echo "::error file=$f::worker-ai must run at most 1 replica, has $r"; exit 1; }
            r=$(yq ea 'select(.kind == "Deployment" and .metadata.name == "worker-io") | .spec.replicas' "$f")
            [ "$r" = null ] || { echo "::error file=$f::worker-io sets replicas ($r); KEDA owns them (#52)"; exit 1; }
            echo "$f: ok"
          done
