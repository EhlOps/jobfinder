# Renders every Kustomize entry point under deploy/k8s and validates the output against the
# Kubernetes schemas (kubeconform), so a broken manifest is caught before anyone applies it.
# Custom resources (SealedSecret, HelmChart, KEDA's ScaledObject) are checked against the community
# CRDs-catalog; a kind that neither knows is skipped (-ignore-missing-schemas).
name: k8s

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "deploy/k8s/**"
      - "deploy/k3s/manifests/**"
      # The app's ConfigMap is generated from these (#43).
      - "backend/kustomization.yaml"
      - "backend/.env.defaults"
      - ".github/workflows/k8s.yml"
  push:
    branches: [main, dev]
    paths:
      - "deploy/k8s/**"
      - "deploy/k3s/manifests/**"
      # The app's ConfigMap is generated from these (#43).
      - "backend/kustomization.yaml"
      - "backend/.env.defaults"
      - ".github/workflows/k8s.yml"

concurrency:
  group: k8s-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Render
        run: |
          mkdir -p rendered
          for k in deploy/k8s/overlays/staging deploy/k8s/overlays/prod deploy/k8s/hello; do
            out="rendered/$(echo "$k" | tr / _).yaml"
            echo "kustomize $k -> $out"
            kubectl kustomize "$k" > "$out"
          done
          # Cluster add-on manifests that k3s applies itself (HelmChart: validated through the catalog).
          cp deploy/k3s/manifests/*.yaml rendered/

      - name: Validate
        run: |
          docker run --rm -v "$PWD/rendered:/r" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -ignore-missing-schemas -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary -output text /r

      # #52, #124. Every worker (each Deployment named worker-*) autoscales on its stream's lag: exactly
      # one ScaledObject targets it (none would leave it at 1, two would fight), and its Deployment sets
      # no replicas (KEDA's HPA owns them; every deploy would reset the count). Parallel Claude calls are
      # capped by the Claude gate, not by worker-ai's replica count. Each ScaledObject's redis-streams
      # triggers must read its own namespace's valkey: the base names prod's, so an overlay that forgets
      # the address patch would scale staging on prod's backlog. yq is preinstalled on the runner.
      - name: Scaling policy
        run: |
          for f in rendered/deploy_k8s_overlays_*.yaml; do
            fail() { echo "::error file=$f::$1"; exit 1; }
            workers=$(yq ea -N 'select(.kind == "Deployment" and (.metadata.name | test("^worker-"))) | .metadata.name' "$f")
            [ -n "$workers" ] || fail "no worker- Deployment rendered"
            for w in $workers; do
              n=$(yq ea -N "[select(.kind == \"ScaledObject\" and .spec.scaleTargetRef.name == \"$w\")] | length" "$f")
              [ "$n" = 1 ] || fail "$w must have exactly one ScaledObject, has $n (#124)"
              n=$(yq ea -N "[select(.kind == \"HorizontalPodAutoscaler\" and .spec.scaleTargetRef.name == \"$w\")] | length" "$f")
              [ "$n" = 0 ] || fail "$w has its own HorizontalPodAutoscaler; KEDA's would fight it (#124)"
              r=$(yq ea -N "select(.kind == \"Deployment\" and .metadata.name == \"$w\") | .spec.replicas" "$f")
              [ "$r" = null ] || fail "$w sets replicas ($r); KEDA owns them (#52)"
            done
            bad=$(yq e -N 'select(.kind == "ScaledObject") | .metadata.namespace as $ns | .metadata.name as $so
                         | .spec.triggers[] | select(.type == "redis-streams")
                         | select(.metadata.address != "valkey." + $ns + ".svc.cluster.local:6379")
                         | $so + " (" + $ns + ") reads " + .metadata.address' "$f")
            [ -z "$bad" ] || fail "ScaledObject trigger not on its own namespace's valkey: $bad"
            echo "$f: ok ($(echo $workers))"
          done
