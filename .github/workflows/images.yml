# Builds the four arm64 images (the k3s host is aarch64) and publishes them to GHCR:
#   ghcr.io/ehlops/jobfinder-{api,worker,renderer,web}:{sha-<short sha>,main|dev}
# Pull requests build only (no push), to catch broken Dockerfiles before merge.
# Pushes and PRs build only the images whose build context changed (backend/** -> api, worker,
# renderer; frontend/** -> web); a change to this workflow, or a manual run, builds all four.
#
# One-time step for the owner: a package created by the first push starts out PRIVATE, even though
# the repo is public. Open each package (github.com/EhlOps?tab=packages → jobfinder-<name> →
# Package settings → Change visibility) and switch it to Public. Until then k3s pulls fail with
# 401/403, because the cluster uses no pull secret.
name: images

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

concurrency:
  group: images-${{ github.event.pull_request.number || github.sha }}
  # PRs share a group and cancel superseded builds. Pushes get one group per commit (a shared group
  # would still drop queued runs), so every push to main/dev publishes its sha-<short> tag,
  # because overlays pin images by SHA (#43).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # Decides which images to build. The build context of each Dockerfile is its whole directory
  # (backend/ or frontend/), so a filter per directory covers everything that can change an image.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists PR files through the API
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'  # PRs use the API; pushes diff locally

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # On a push, compare with the commit before the push (not the default branch).
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/images.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/images.yml"

      - name: Build matrix
        id: matrix
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          entries=()
          if [ "$ALL" = true ] || [ "$BACKEND" = true ]; then
            entries+=('{"name":"api","context":"backend","dockerfile":"backend/Dockerfile"}')
            # WITH_JOBSPY keeps its Dockerfile default (false)
            entries+=('{"name":"worker","context":"backend","dockerfile":"backend/Dockerfile.worker"}')
            entries+=('{"name":"renderer","context":"backend","dockerfile":"backend/Dockerfile.renderer"}')
          fi
          if [ "$ALL" = true ] || [ "$FRONTEND" = true ]; then
            entries+=('{"name":"web","context":"frontend","dockerfile":"frontend/Dockerfile"}')
          fi
          matrix="[$(IFS=,; echo "${entries[*]}")]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Images to build: $matrix"

  build:
    name: build (${{ matrix.name }})
    needs: changes
    # An empty matrix is an error, so skip the job when nothing needs building. No branch protection
    # requires these checks and no job depends on build, so a skipped build blocks nothing.
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-24.04-arm  # native arm64: no QEMU emulation
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short sha> always, plus the branch name (main/dev) on pushes and pr-<n> on PRs.
      # The default labels include org.opencontainers.image.source, which links the package to the repo.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/ehlops/jobfinder-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=jobfinder-${{ matrix.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Pushes to dev roll staging forward once every image of the commit is in GHCR (#43). Skipped with
  # build (nothing changed to build) and on any build failure, so staging never gets half a commit.
  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
