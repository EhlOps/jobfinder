# A local-path StorageClass whose volumes survive deleting their PVC (#40). The k3s default
# `local-path` class uses reclaimPolicy Delete, so a stray `kubectl delete pvc` (or deleting the
# namespace) would wipe the directory under /var/lib/rancher/k3s/storage. Stateful data (Postgres,
# valkey, store, claude-auth) uses this class instead; a released PV keeps its data on
# disk until someone deletes the PV by hand. Not the default class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
