# sealed-secrets controller (#38), deployed by k3s's Helm controller. fullnameOverride keeps the
# name kubeseal expects by default (kube-system/sealed-secrets-controller).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  repo: https://bitnami.github.io/sealed-secrets
  chart: sealed-secrets
  version: 2.20.0            # app v0.40.0; keep in step with KUBESEAL_VERSION in install.sh
  targetNamespace: kube-system
  valuesContent: |-
    fullnameOverride: sealed-secrets-controller
