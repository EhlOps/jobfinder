# Overrides for k3s's bundled Traefik (#38). Host Caddy owns 80/443 and is the TLS edge, so Traefik
# is reachable on 127.0.0.1:8280 only, plain HTTP. Caddy proxies to it from the cutover (#47) on.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      type: ClusterIP        # servicelb is disabled; a LoadBalancer would sit pending
    # The chart reuses ports.web.hostIP as the in-pod bind address too, which would leave Traefik listening on
    # the pod's own loopback. Re-bind inside the pod; hostIP still limits the host side to 127.0.0.1.
    # One node and a hostPort: the old pod must stop before the new one can bind 8280.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    additionalArguments:
      - "--entryPoints.web.address=:8000/tcp"
      # Keep host Caddy's X-Forwarded-For (the real client IP; the app's rate limiter needs it, #43).
      # Connections to the 127.0.0.1:8280 hostPort are masqueraded by the CNI portmap rules, so
      # Traefik sees them from cni0's address, 10.42.0.1; only the host can originate from it. Other
      # pods keep their own IPs and stay untrusted: Traefik replaces whatever header they send.
      # 10.42.0.1 is cni0 on this node (the first node's pod subnet, 10.42.0.0/24). If a rebuild ever
      # hands the node another subnet, update this; deploy/k8s/deploy.sh warns when cni0 differs.
      - "--entryPoints.web.forwardedHeaders.trustedIPs=10.42.0.1/32"
    ports:
      web:
        hostPort: 8280
        hostIP: 127.0.0.1    # never 0.0.0.0
      websecure:
        expose:
          default: false     # TLS ends at host Caddy
