# Shared volumes (#40). `store` (uploaded documents) and `claude-auth` (the Claude token) are mounted
# by the app (#43).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The data tier (#47): the objects a restore needs before the app (the cutover applied these first).
labels:
  - pairs:
      jobfinder.io/tier: data

resources:
  - pvcs.yaml
