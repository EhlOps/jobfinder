# Shared volumes (#40). `store` and `claude-auth` replace the compose volumes of the same names and
# are mounted by the app (#43).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The data tier: prod-cutover.sh applies only objects with this label before it restores (#47).
labels:
  - pairs:
      jobfinder.io/tier: data

resources:
  - pvcs.yaml
