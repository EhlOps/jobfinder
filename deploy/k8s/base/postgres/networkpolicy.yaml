# Only pods in the same namespace that carry `jobfinder.io/postgres-client: "true"` reach 5432:
# the app Deployments (#43) set it. Everything else, including other
# pods in this namespace and every other namespace, is dropped. Enforced by k3s's embedded
# network policy controller (kube-router); don't start k3s with --disable-network-policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              jobfinder.io/postgres-client: "true"
      ports:
        - protocol: TCP
          port: 5432
