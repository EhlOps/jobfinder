# Nightly backup at 03:15 UTC (#47; replaced the host-cron deploy/backup.sh, deleted in #53).
#   db-<UTC timestamp>.dump        pg_dump -Fc of the jobfinder database
#   files-<UTC timestamp>.tar.gz   store/ and claude/ (uploaded documents, link text, the Claude token)
# on PVC `backups` (deploy/k8s/backup-restore.sh restores the newest dump into a scratch database).
# Each file is written as .part and renamed when complete; the newest BACKUP_KEEP of each kind
# are kept. Run one now: kubectl -n <ns> create job --from=cronjob/backup backup-manual.
# Pre-deploy backups (#118): the deploy wrapper runs a Job from this CronJob with BACKUP_PREFIX=pre-,
# writing pre-db-<ts>.dump and pre-files-<ts>.tar.gz. They are a separate pool, the newest
# BACKUP_PRE_KEEP of each kind, so several releases in a day can't push out the nightly dumps.
# local-path volumes are RWO but node-local on this single node, so mounting `store` and
# `claude-auth` next to the running app is fine.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "15 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  # A node that was down at 03:15 still backs up when it comes back within the hour.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
            app.kubernetes.io/component: backup
            # NetworkPolicy `postgres` admits only labelled pods.
            jobfinder.io/postgres-client: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            # The app's uid (10001): it owns the files in store/ and claude/, and the token is 0600.
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # Same version as the server (base/postgres), so pg_dump matches it.
              image: postgres:16.15
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  umask 077
                  # Only these two prefixes: the rotations below would never clean any other (#118).
                  case "$BACKUP_PREFIX" in
                    ''|pre-) ;;
                    *) echo "BACKUP_PREFIX must be empty or pre-, not '$BACKUP_PREFIX'" >&2; exit 1 ;;
                  esac
                  ts=$(date -u +%Y%m%d-%H%M%S)
                  db="/backups/${BACKUP_PREFIX}db-$ts.dump"
                  files="/backups/${BACKUP_PREFIX}files-$ts.tar.gz"
                  # A failed run leaves no partial files.
                  trap 'rm -f "$db.part" "$files.part"' EXIT
                  # kube-router admits a new pod's IP a few seconds after it starts (until then:
                  # "connection refused"), so wait for postgres first, up to two minutes.
                  i=0
                  until pg_isready -q -h postgres -U jobfinder -t 2; do
                    i=$((i + 1)); [ "$i" -lt 60 ] || { echo "postgres unreachable" >&2; exit 1; }
                    sleep 2
                  done
                  pg_dump -h postgres -U jobfinder -d jobfinder -Fc -f "$db.part"
                  # The archive's table of contents must read back.
                  pg_restore --list "$db.part" >/dev/null
                  mv "$db.part" "$db"
                  # Exit 1 is GNU tar's "file changed as we read it" (the app keeps running): the
                  # archive is complete apart from that file's newest bytes. 2 and up are failures.
                  rc=0; tar -C /data -czf "$files.part" store claude || rc=$?
                  [ "$rc" -le 1 ] || exit "$rc"
                  mv "$files.part" "$files"
                  # Newest BACKUP_KEEP of each nightly kind and BACKUP_PRE_KEEP of each pre-deploy kind
                  # (timestamped names sort oldest first; 'db-*' doesn't match 'pre-db-*').
                  for rot in "$BACKUP_KEEP db-*.dump" "$BACKUP_KEEP files-*.tar.gz" \
                             "$BACKUP_PRE_KEEP pre-db-*.dump" "$BACKUP_PRE_KEEP pre-files-*.tar.gz"; do
                    keep=${rot%% *} pat=${rot#* }
                    find /backups -maxdepth 1 -name "$pat" | sort -r | tail -n +"$((keep + 1))" \
                      | while read -r old; do rm -f -- "$old"; done
                  done
                  echo "backup ok: $db ($(du -h "$db" | cut -f1)) $files ($(du -h "$files" | cut -f1))"
                  ls -l /backups
              env:
                - name: BACKUP_KEEP
                  value: "14"
                # "" for a nightly run; the deploy wrapper sets pre- on its Job (#118).
                - name: BACKUP_PREFIX
                  value: ""
                - name: BACKUP_PRE_KEEP
                  value: "5"
                - name: HOME
                  value: /tmp
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: store
                  mountPath: /data/store
                  readOnly: true
                - name: claude-auth
                  mountPath: /data/claude
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
            - name: store
              persistentVolumeClaim:
                claimName: store
            - name: claude-auth
              persistentVolumeClaim:
                claimName: claude-auth
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
