# worker-io (#48; compose: worker-io, profile "ledger"): the taskiq worker on stream `jobfinder:io`:
# the ingest kinds (ingest_tick fans out one ingest_board per board), plan_work, discover_boards,
# score_coveted, resolve_job_link and audit_coverage, daily_emails, which sends mail over SMTP (#50), and
# parse_document and fetch_link, which read uploads and profile links off the api into the document store
# (#51; tasks/kinds.py), so it mounts the store. None of them calls Claude (the resolver's LLM rung is
# induce_recipe, on the ai queue), so no claude-auth volume. The worker image anyway: it has everything ingestion needs
# (the jobspy extra when built with it), and one image for both task workers keeps deploy.sh's pinning
# simple. Up to WORKER_IO_CONCURRENCY tasks at once in one process.
# Recreate like the other workers: a rollout pauses io work for a few seconds, and messages wait in the
# stream meanwhile. Claims are atomic, so overlapping consumers would be safe too.
# Replicas: KEDA (worker-io-scaledobject.yaml, #52) scales it from 1 to 4 on the stream's backlog, so
# there is no `replicas` here: a value would reset the HPA's count on every deploy. The ScaledObject is
# paused at 0 in the base (the stream only carries work under TASKS_BACKEND=ledger) and an overlay on the
# ledger unpauses it (overlays/staging; docs/k3s.md, "Task platform" and "KEDA").
# No PodDisruptionBudget: on one node it only matters for a drain (a k3s upgrade), and minAvailable 1
# would block that drain while a pod stopping mid-task costs nothing (graceful shutdown, then the reaper).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-io
  labels:
    jobfinder.io/rollout: app
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-io
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-io
        app.kubernetes.io/component: worker
        jobfinder.io/postgres-client: "true"
        jobfinder.io/valkey-client: "true"   # consumes jobfinder:io, publishes follow-ups (plan_work, ...)
    spec:
      automountServiceAccountToken: false
      # Lets an in-flight task finish its current board and ack; the reaper requeues anything cut off.
      terminationGracePeriodSeconds: 60
      securityContext:
        # The image's `jobfinder` user (backend/Dockerfile.worker).
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-io
          image: ghcr.io/ehlops/jobfinder-worker
          # tini (the image's entrypoint), then one taskiq worker process for the io queue.
          args: ["python", "-m", "jobfinder.tasks", "io"]
          envFrom:
            - configMapRef:
                name: jobfinder-config
            - secretRef:
                name: jobfinder-env
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          # No HTTP endpoint; see worker-ai.yaml.
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -qs 'jobfinder[.]tasks' /proc/[0-9]*/cmdline"]
            initialDelaySeconds: 15
            periodSeconds: 30
          # Requests are what the scheduler reserves per replica, up to 4 per environment on the 4-CPU node
          # (#52): 8 x 250m on top of the rest (~1.7 CPU, KEDA included) still fits with both at the max.
          # Ingest is mostly waiting on sites, so CPU is unlimited and bursts above the request. Memory
          # requests cover a busy pod's working set (prod: ~700Mi after a tick).
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              # Python with WORKER_IO_CONCURRENCY tasks, each fetching one board (ingest_board, #50).
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Uploads and link snapshots it reads and writes (parse_document, fetch_link).
            - name: store
              mountPath: /data/store
            # Temp files of ingestion.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: store
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
