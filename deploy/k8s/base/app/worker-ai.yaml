# worker-ai (#48; compose: worker-ai, profile "ledger"): the taskiq worker on stream `jobfinder:ai`,
# which carries every kind that may call Claude (tasks/kinds.py: profile, matching, letters, resumes,
# questions, daily emails, the resolver and the coverage audit). The only task worker with the claude
# CLI, so the worker image, the claude-auth volume and a $HOME for the CLI's state.
# One process runs up to AI_MAX_CONCURRENCY tasks at once, and that is also the cap on parallel Claude
# calls against the subscription; a second replica would double it, so replicas stay at 1 and the
# strategy is Recreate (a RollingUpdate would overlap two pods). It claims each ledger row atomically, so
# overlapping consumers (this pod and the legacy worker during a switch-over) never run a task twice.
# Its stream only carries work under TASKS_BACKEND=ledger, so the base keeps it at 0 and an overlay that flips to the ledger scales it to 1 (overlays/staging; docs/k3s.md, "Task platform").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ai
  labels:
    jobfinder.io/rollout: app
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-ai
        app.kubernetes.io/component: worker
        jobfinder.io/postgres-client: "true"
        jobfinder.io/valkey-client: "true"   # consumes jobfinder:ai, publishes follow-ups
    spec:
      automountServiceAccountToken: false
      # Lets an in-flight task (a cover letter takes a minute or so) finish and ack. A task cut off is
      # still `running` in the ledger: the scheduler's reaper requeues it, and its unacked message is
      # redelivered (and dropped, since the claim no longer matches) or the relay re-sends it.
      terminationGracePeriodSeconds: 60
      securityContext:
        # The image's `jobfinder` user (backend/Dockerfile.worker).
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-ai
          image: ghcr.io/ehlops/jobfinder-worker
          # tini (the image's entrypoint), then one taskiq worker process for the ai queue.
          args: ["python", "-m", "jobfinder.tasks", "ai"]
          envFrom:
            - configMapRef:
                name: jobfinder-config
            - secretRef:
                name: jobfinder-env
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          # No HTTP endpoint (taskiq has none). tini (PID 1) exits when the worker dies, which restarts
          # the container anyway; this checks the worker process is still there. [.] keeps the probe's
          # own command line from matching.
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -qs 'jobfinder[.]tasks' /proc/[0-9]*/cmdline"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              # Python plus up to AI_MAX_CONCURRENCY node `claude` processes.
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Resumes and tailored documents.
            - name: store
              mountPath: /data/store
            # The OAuth token saved on "AI setup".
            - name: claude-auth
              mountPath: /data/claude
            # CLAUDE_SCRATCH_DIR and temp files.
            - name: tmp
              mountPath: /tmp
            # The claude CLI keeps its state under $HOME; fresh per pod.
            - name: home
              mountPath: /home/jobfinder
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: store
        - name: claude-auth
          persistentVolumeClaim:
            claimName: claude-auth
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: home
          emptyDir:
            sizeLimit: 256Mi
