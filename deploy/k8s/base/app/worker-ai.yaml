# worker-ai (#48): the taskiq worker on stream `jobfinder:ai`,
# which carries every kind that may call Claude (tasks/kinds.py: profile, matching, letters, resumes,
# questions, daily emails, the resolver and the coverage audit). The only task worker with the claude
# CLI, so the worker image, the claude-auth volume and a $HOME for the CLI's state.
# One process runs up to WORKER_AI_CONCURRENCY tasks at once. Parallel Claude calls against the
# subscription are capped cluster-wide by the Claude gate (AI_MAX_CONCURRENCY permits shared through
# valkey, integrations/claude/gate.py), not by this process or the number of pods. So worker-ai
# autoscales on its stream's lag like every worker (worker-ai-scaledobject.yaml, #124): KEDA owns the
# replica count, hence no `replicas` here. The strategy was Recreate while one process was the cap (two
# pods mid-rollout would have doubled it); with the gate a rollout's overlap is safe, so RollingUpdate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ai
  labels:
    jobfinder.io/rollout: app
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The default 25% rounds down to 0 at 1-3 replicas, so a rollout could only add a pod first, and
      # on a full node that surge pod stays Pending and the rollout hangs. 1: one old pod may stop (and
      # free its CPU) while its replacement starts.
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-ai
        app.kubernetes.io/component: worker
        jobfinder.io/postgres-client: "true"
        jobfinder.io/valkey-client: "true"   # consumes jobfinder:ai, publishes follow-ups
    spec:
      automountServiceAccountToken: false
      # Lets an in-flight task finish and ack: a matching slice runs ~2.5 minutes, and the worker waits
      # up to 180s for its tasks on SIGTERM (WAIT_TASKS_SECONDS, tasks/__main__.py), so a pod KEDA scales
      # in or a rollout replaces exits cleanly. A task cut off is still `running` in the ledger: the
      # scheduler's reaper requeues it, and its unacked message is redelivered (and dropped, since the
      # claim no longer matches) or the relay re-sends it.
      terminationGracePeriodSeconds: 200
      securityContext:
        # The image's `jobfinder` user (backend/Dockerfile.worker).
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-ai
          image: ghcr.io/ehlops/jobfinder-worker
          # tini (the image's entrypoint), then one taskiq worker process for the ai queue.
          args: ["python", "-m", "jobfinder.tasks", "ai"]
          envFrom:
            - configMapRef:
                name: jobfinder-config
            - secretRef:
                name: jobfinder-env
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          # No HTTP endpoint (taskiq has none). tini (PID 1) exits when the worker dies, which restarts
          # the container anyway; this checks the worker process is still there. [.] keeps the probe's
          # own command line from matching.
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -qs 'jobfinder[.]tasks' /proc/[0-9]*/cmdline"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              # Python plus up to AI_MAX_CONCURRENCY node `claude` processes (the gate's cap bounds one pod too).
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Resumes and tailored documents.
            - name: store
              mountPath: /data/store
            # The OAuth token saved on "AI setup".
            - name: claude-auth
              mountPath: /data/claude
            # CLAUDE_SCRATCH_DIR and temp files.
            - name: tmp
              mountPath: /tmp
            # The claude CLI keeps its state under $HOME; fresh per pod.
            - name: home
              mountPath: /home/jobfinder
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: store
        - name: claude-auth
          persistentVolumeClaim:
            claimName: claude-auth
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: home
          emptyDir:
            sizeLimit: 256Mi
