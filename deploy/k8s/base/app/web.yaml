# Caddy with the built SPA: serves the app, proxies /api/* and /healthz to api:8000 and
# sets the security headers (frontend/Caddyfile). Traefik routes every request here (ingress.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    jobfinder.io/rollout: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The caddy image has no USER and runs as root; nobody works because it binds :8080 and never
        # manages certificates here (TLS ends at host Caddy).
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/ehlops/jobfinder-web
          env:
            # A port-only address: plain HTTP, no ACME, and unprivileged.
            - name: SITE_ADDRESS
              value: ":8080"
            # The hop before this pod is Traefik, whose IP is in the pod CIDR. Caddy keeps the
            # X-Forwarded-For it receives from there (host Caddy's real client IP) and replaces anyone
            # else's. (The Caddyfile default is the Docker bridge range.)
            - name: TRUSTED_PROXIES
              value: 10.42.0.0/16
            # Caddy's storage and autosaved config, on emptyDirs (the root filesystem is read-only).
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /config
          ports:
            - name: http
              containerPort: 8080
          # Served by Caddy itself (the SPA fallback), so a slow api never takes the web pod out.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # The image sets cap_net_bind_service on /usr/bin/caddy as a file capability; the kernel
              # refuses to exec such a binary ("operation not permitted") when the capability is
              # missing from the bounding set. Nothing is granted: the user is non-root and
              # no_new_privs (allowPrivilegeEscalation: false) blocks file capabilities.
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: config
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
