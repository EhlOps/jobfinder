# Valkey for the task platform (#48). Unused until then; deployed now so #48 is code-only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The data tier: prod-cutover.sh applies only objects with this label before it restores (#47).
labels:
  - pairs:
      jobfinder.io/tier: data

resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
