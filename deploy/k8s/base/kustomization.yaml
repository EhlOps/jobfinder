# Base layer shared by every environment. Overlays in ../overlays/ pull this
# in and add environment-specific settings; apply an overlay, not the base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jobfinder

# `labels` (not the deprecated `commonLabels`) without includeSelectors, so
# selectors stay untouched: Deployment selectors are immutable, and changing
# a common label later would otherwise force a delete-and-recreate.
labels:
  - pairs:
      app.kubernetes.io/part-of: jobfinder
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  # #40. Each overlay must also supply the Secret `postgres-credentials` (key POSTGRES_PASSWORD)
  # as a SealedSecret sealed for its namespace; see deploy/k8s/README.md.
  - postgres/        # Postgres 16 StatefulSet, Service, NetworkPolicy (app pods only)
  - valkey/          # valkey StatefulSet (AOF) for the task streams (#48)
  - storage/         # PVCs: store, claude-auth (mounted by the app in #43)
  # #43: the app (web, api, scheduler, worker-ai, worker-io, renderer, smtp, the migrate Job, the
  # Ingress). Each overlay supplies the Secret `jobfinder-env` as a SealedSecret and pins the images; see deploy/k8s/README.md.
  - app/
  # #47: nightly backup CronJob onto the `backups` PVC (replaces deploy/backup.sh); restore drill:
  # deploy/k8s/backup-restore.sh.
  - data/
