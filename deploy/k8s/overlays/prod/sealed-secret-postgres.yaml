# Secret postgres-credentials (POSTGRES_PASSWORD, random, prod only) sealed for jobfinder (#47).
# Regenerate with the kubeseal command in deploy/k8s/README.md; only the cluster can decrypt it.
# Rotating it later also needs ALTER ROLE inside the database (docs/k3s.md, "Data services").
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  labels:
    jobfinder.io/tier: data   # applied before a restore (#47)
  name: postgres-credentials
  namespace: jobfinder
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: postgres-credentials
      namespace: jobfinder
