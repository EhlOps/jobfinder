# Secret smtp-relay sealed for jobfinder (#47): postfix's credentials for the Gmail relay
# (RELAYHOST_USERNAME, RELAYHOST_PASSWORD from compose's root .env), read by the smtp patch in
# kustomization.yaml. Regenerate with the kubeseal command in deploy/k8s/README.md, "Secrets".
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  labels:
    jobfinder.io/tier: data   # applied before the restore (prod-cutover.sh)
  name: smtp-relay
  namespace: jobfinder
spec:
  encryptedData:
    RELAYHOST_PASSWORD: 
    RELAYHOST_USERNAME: 
  template:
    metadata:
      name: smtp-relay
      namespace: jobfinder
