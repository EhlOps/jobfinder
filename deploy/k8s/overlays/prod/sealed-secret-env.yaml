# Secret jobfinder-env sealed for jobfinder (#47):
# - SECRET_KEY: fresh, random, prod only (rotated 2026-10-21; the pre-k3s key is retired).
# - CLAUDE_CODE_OAUTH_TOKEN: empty; the token saved on the admin "AI setup" page lives in the
#   claude-auth volume and wins over this env fallback.
# - ADMIN_EMAILS: kept out of the public repo, so here rather than in the ConfigMap.
# Regenerate with the kubeseal command in deploy/k8s/README.md, "Secrets".
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  labels:
    jobfinder.io/tier: data   # applied before a restore (#47)
  name: jobfinder-env
  namespace: jobfinder
spec:
  encryptedData:
    ADMIN_EMAILS: 
    CLAUDE_CODE_OAUTH_TOKEN: 
    SECRET_KEY: 
  template:
    metadata:
      name: jobfinder-env
      namespace: jobfinder
