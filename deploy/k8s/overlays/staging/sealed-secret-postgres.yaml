# Secret postgres-credentials (POSTGRES_PASSWORD, random) sealed for jobfinder-staging (#40).
# Regenerate with the kubeseal command in deploy/k8s/README.md; only the cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  labels:
    jobfinder.io/tier: data   # applied before a restore (#47)
  name: postgres-credentials
  namespace: jobfinder-staging
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: postgres-credentials
      namespace: jobfinder-staging
