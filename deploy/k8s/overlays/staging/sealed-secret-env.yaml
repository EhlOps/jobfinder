# Secret jobfinder-env sealed for jobfinder-staging (#43): SECRET_KEY (fresh, random, staging only)
# and CLAUDE_CODE_OAUTH_TOKEN (the token saved on prod's admin "AI setup" page). Regenerate with
# the kubeseal command in deploy/k8s/README.md, "Secrets"; only the cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jobfinder-env
  namespace: jobfinder-staging
spec:
  encryptedData:
    CLAUDE_CODE_OAUTH_TOKEN: 
    SECRET_KEY: 
  template:
    metadata:
      name: jobfinder-env
      namespace: jobfinder-staging
